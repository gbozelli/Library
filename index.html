<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
</head>
<body>
  <div id="new"></div>
  <dialog>
    <form>
      <label>Task</label>
      <input class="name" type="text" required />
      <label>Date</label>
      <input class="author" type="text" required />
      <label>Priority</label>
      <input class="pages" type="text" required />
      <label>Check</label>
      <input class="select" type="text" required />
      <div>
        <button value="cancel" formmethod="dialog">Cancel</button>
        <button id="submit" value="default">Confirm</button>
      </div>
    </form>
  </dialog>
  <button class="add">Add</button>
  <script src="script.js"></script>
</body>
</html>
